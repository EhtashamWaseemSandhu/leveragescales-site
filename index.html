<style>
:root {
  --bg: #09090b;
  --surface: #121216;
  --surface-hover: #18181f;
  --border: #27272a;
  --text: #fafafa;
  --muted: #a1a1aa;
  --dim: #71717a;
  --indigo: #4f46e5;
  --indigo-hover: #4338ca;
  --indigo-hi: #818cf8;
  --emerald: #34d399;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; color-scheme: dark; }
body {
  margin: 0;
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background-color: var(--bg);
  background-image: radial-gradient(circle at 50% 0%, rgba(79, 70, 229, 0.14) 0%, transparent 55%);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
h1, h2, h3, p { margin: 0; }

.wrap { width: min(100% - 2.5rem, 1100px); margin-inline: auto; }

/* Navigation */
header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(9, 9, 11, 0.82);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 72px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  font-size: 1.15rem;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.brand span { color: var(--indigo-hi); }
.nav-links {
  display: flex;
  align-items: center;
  gap: 2rem;
  font-size: 0.92rem;
  color: var(--muted);
  font-weight: 500;
}
.nav-links a:hover { color: var(--text); }
.btn-sm {
  padding: 0.55rem 1.15rem;
  background: var(--indigo);
  color: #fff;
  border-radius: 8px;
  font-size: 0.88rem;
  font-weight: 600;
  transition: background 0.2s;
}
.btn-sm:hover { background: var(--indigo-hover); }

/* Hero */
.hero {
  padding: 5.5rem 0 4.5rem;
  text-align: center;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  padding: 0.4rem 0.95rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 99px;
  font-size: 0.85rem;
  color: var(--muted);
  margin-bottom: 1.75rem;
}
.pill-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--emerald);
  box-shadow: 0 0 10px var(--emerald);
}
.hero h1 {
  max-width: 18ch;
  margin-inline: auto;
  font-size: clamp(2.5rem, 6vw, 4.35rem);
  font-weight: 800;
  line-height: 1.08;
  letter-spacing: -0.035em;
}
.hero h1 span {
  background: linear-gradient(135deg, #fff 30%, var(--indigo-hi) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero p {
  max-width: 54ch;
  margin: 1.35rem auto 0;
  color: var(--muted);
  font-size: 1.12rem;
}
.hero-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 1rem;
  margin-top: 2.25rem;
}
.btn-primary {
  padding: 0.95rem 1.85rem;
  background: var(--indigo);
  color: #fff;
  border-radius: 10px;
  font-weight: 600;
  font-size: 0.98rem;
  transition: transform 0.15s, background 0.2s;
}
.btn-primary:hover { background: var(--indigo-hover); transform: translateY(-1px); }
.btn-secondary {
  padding: 0.95rem 1.85rem;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  font-weight: 600;
  font-size: 0.98rem;
  transition: border-color 0.2s, background 0.2s;
}
.btn-secondary:hover { border-color: #3f3f46; background: var(--surface-hover); }

/* Metrics Strip */
.metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.25rem;
  margin-top: 4.5rem;
  padding: 1.75rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
}
.metric-val {
  font-size: 1.65rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--text);
}
.metric-val span { color: var(--emerald); }
.metric-lbl {
  font-size: 0.88rem;
  color: var(--muted);
  margin-top: 0.2rem;
}

/* Sections */
section { padding: 5rem 0; border-top: 1px solid var(--border); }
.sec-head { max-width: 58ch; margin-bottom: 3rem; }
.eyebrow {
  font-size: 0.82rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--indigo-hi);
  margin-bottom: 0.65rem;
}
.sec-head h2 {
  font-size: clamp(1.85rem, 4vw, 2.6rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.15;
}
.sec-head p {
  margin-top: 0.85rem;
  color: var(--muted);
  font-size: 1.02rem;
}

.grid-3 {
